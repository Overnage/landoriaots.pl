<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landoria Loot</title>
<style>
/* ===== KOLORY ===== */
:root{
  --bg:#141414;
  --panel:#2b2929;
  --sunk:#2f2e2e;
  --row:#343434;
  --row-hover:#5e08176b;
  --line:#464646;
  --fg:#e5e5e5;
  --text:#c0bfbf;
  --muted:#969696;
  --accent:#aa1428;
  --accent-text:#e62640;
  --accent-border:rgba(170,20,40,.45);
  --focus:#e62640;
  --r0:#dbdbdb; --r1:#00f70c; --r2:#36abe5; --r3:#9842ee; --r4:#eeee09;
  --danger:#ff4d4d; --warn:#ffb347; --ok:#4fdc6c;
  --f-display:Verdana,Arial,Helvetica,sans-serif;
  --f-body:Arial,Helvetica,sans-serif;
  --f-mono:Verdana,Arial,Helvetica,sans-serif;
  color-scheme:dark;
}
/* ===== KONIEC KOLORÓW ===== */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;letter-spacing:-.01em;margin:0;line-height:1.1;color:var(--fg)}
h1 span{color:var(--accent-text)}
.ph h2{color:var(--fg)}
.meta{color:var(--muted);font-size:.85rem}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:13px 14px 13px 42px;border:1px solid var(--accent-border);border-radius:10px;background:var(--panel);color:var(--fg);outline:none}
.search input:focus{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--row-hover)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sugg{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.55);list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow-y:auto}
.sugg li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.sugg li[aria-selected="true"]{background:var(--row-hover)}
.sugg .nm{color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg mark{background:none;color:var(--accent-text);font-weight:700}
.sugg .info{color:var(--muted);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.kind{font-family:var(--f-display);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.kind.item{color:var(--accent-text);border-color:var(--accent-border)}
.sugg .empty{color:var(--muted);cursor:default}
.panel{background:var(--panel);border:1px solid var(--accent-border);border-top:4px solid var(--accent);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--fg);margin:0;line-height:1.15;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:.9rem}
.eyebrow{font-family:var(--f-display);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.filters{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted)}
.filters label{display:flex;gap:6px;align-items:center;cursor:pointer}
.filters input[type=number]{width:96px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-family:var(--f-mono)}
.filters input[type=checkbox]{accent-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid #000;border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bg);white-space:nowrap}
td{background:var(--row)}
tr:last-child td{border-bottom:none}
th{font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--accent-text)}
th .arr{color:var(--accent-text)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--row-hover)}
.link{background:none;border:none;padding:0;font:inherit;color:var(--fg);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent-text);color:var(--accent-text)}
.link:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.boss{color:var(--warn);font-size:.62rem;font-weight:700;font-family:var(--f-display);letter-spacing:.06em;margin-left:6px}
.rar{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.rar::before{content:"";width:9px;height:9px;border-radius:2px;background:currentColor}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.chance{color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.hit-ok{color:var(--ok)}.hit-warn{color:var(--warn)}.hit-bad{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:#000;border:1px solid #000;border-radius:6px;overflow:hidden}
.stat{background:var(--row);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-display);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h3{font-family:var(--f-display);font-weight:700;font-size:1rem;margin:0;color:var(--accent-text)}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent-text);vertical-align:middle;margin-right:8px;opacity:.8}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.lootgrp{display:flex;flex-direction:column;gap:4px}
.lootgrp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lootgrp li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--row)}
.lootgrp li:last-child{border-bottom:none}
.cnt{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.85rem}
.hist{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-size:.82rem;padding:4px 10px;border-radius:99px;border:1px solid var(--accent-border);background:var(--panel);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--accent-text);color:var(--fg);background:var(--row-hover)}
footer{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.85rem}
.empty-state{color:var(--muted);padding:12px 0}
@media(max-width:520px){h1{font-size:1.6rem}.ph h2{font-size:1.35rem}th,td{padding:7px 8px}}
@media(prefers-reduced-motion:no-preference){.sugg li,.link,.chip{transition:background .12s,color .12s,border-color .12s}}
.boss-inline{margin:0}
.ico{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:8px;flex:none}
.ico-lg{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;flex:none}
.ico-xl{width:72px;height:72px;object-fit:contain;image-rendering:pixelated;flex:none}
.logo{max-height:56px;max-width:100%;width:auto;display:block}
.ph-title{display:flex;align-items:center;gap:12px;min-width:0}
.li-name{display:flex;align-items:center;min-width:0}
header.has-bg{background-size:cover;background-position:center;border-radius:12px;padding:18px}
</style>
</head>

const ITEM_IMG = lowerKeys(LOOT_CONFIG.itemImages);
const MON_IMG = lowerKeys(LOOT_CONFIG.monsterImages);
const safeSrc = s => s && !/^\s*(javascript|vbscript|data:text)/i.test(s) ? s : "";
const img = (src, cls) => (src = safeSrc(src)) ? `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" decoding="async">` : "";
const itemImg = (name, cls = "ico") => { const k = String(name).toLowerCase(); return img(ITEM_IMG.get(k) || itemImgData.get(k), cls); };
const monImg = (name, cls = "ico") => { const k = String(name).toLowerCase(); return img(MON_IMG.get(k) || byName.get(k)?.img, cls); };
document.addEventListener("error", ev => { if (ev.target.tagName === "IMG") ev.target.hidden = true; }, true);

let M = [], byName = new Map(), items = new Map(), itemImgData = new Map(), entries = [];
const state = { view: null, boss: true, maxHit: "", sort: "rar", dir: 1 };

const savedFilters = readJSON("ll-filters", {});
if (savedFilters && typeof savedFilters === "object") {
  if (typeof savedFilters.boss === "boolean") state.boss = savedFilters.boss;
  if (/^\d{1,7}$/.test(String(savedFilters.maxHit ?? ""))) state.maxHit = String(savedFilters.maxHit);
}

function load(compact) {
  M = compact.map(a => ({
    name: String(a[0]), boss: !!a[1], hp: num(a[2]), exp: num(a[3]), hit: num(a[4]), aoe: num(a[5]), img: String(a[8] || ""),
    spells: a[6].map(s => ({ type: String(s[0]), atk: String(s[1]), min: num(s[2]), max: num(s[3]) })),
    loot: a[7].map(l => ({ name: String(l[0]), r: Math.min(4, Math.max(0, num(l[1]))), c: num(l[2]), img: String(l[3] || "") }))
  }));
  byName = new Map(M.map(m => [m.name.toLowerCase(), m]));
  items = new Map();
  itemImgData = new Map();
  for (const m of M) for (const l of m.loot) {
    const k = l.name.toLowerCase();
    if (l.img && !itemImgData.has(k)) itemImgData.set(k, l.img);
    if (!items.has(k)) items.set(k, { name: l.name, drops: [] });
    items.get(k).drops.push({ m, r: l.r, c: l.c });
  }
  entries = [
    ...[...items.values()].map(i => ({ kind: "item", name: i.name, lc: i.name.toLowerCase(), n: i.drops.length })),
    ...M.map(m => ({ kind: "monster", name: m.name, lc: m.name.toLowerCase(), m }))
  ];
  $("#meta").textContent = `${M.length} potworów · ${items.size} przedmiotów`;
  const author = String(LOOT_CONFIG.author || "").trim();
  $("#src").textContent = author ? `Autor: ${author}` : "";
}

const exists = v => v && typeof v.name === "string" &&
  (v.kind === "item" ? items.has(v.name.toLowerCase()) : v.kind === "monster" && byName.has(v.name.toLowerCase()));

function score(lc, q) {
  if (lc === q) return 0;
  if (lc.startsWith(q)) return 1;
  const i = lc.indexOf(q);
  if (i < 0) return -1;
  return lc[i - 1] === " " ? 2 : 3;
}
function hl(name, q) {
  const i = name.toLowerCase().indexOf(q);
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + q.length)) + "</mark>" + esc(name.slice(i + q.length));
}
const plural = n => n === 1 ? "potwór" : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? "potwory" : "potworów";

let sel = -1, shown = [];
function suggest() {
  const q = $("#q").value.trim().toLowerCase().slice(0, 60);
  const ul = $("#sugg");
  if (!q) { close(); return; }
  shown = entries.map(e => ({ e, s: score(e.lc, q) })).filter(x => x.s >= 0)
    .sort((a, b) => a.s - b.s || (a.e.kind === b.e.kind ? 0 : a.e.kind === "item" ? -1 : 1) || (b.e.n || 0) - (a.e.n || 0) || a.e.name.localeCompare(b.e.name))
    .slice(0, 12).map(x => x.e);
  sel = shown.length ? 0 : -1;
  ul.innerHTML = shown.length ? shown.map((e, i) => `<li role="option" id="opt${i}" data-i="${i}" aria-selected="${i === sel}">
      <span class="kind ${e.kind}">${e.kind === "item" ? "przedmiot" : "potwór"}</span>
      ${e.kind === "item" ? itemImg(e.name) : monImg(e.name)}<span class="nm">${hl(e.name, q)}</span>
      <span class="info">${e.kind === "item" ? `${e.n} ${plural(e.n)}` : `${fmt(e.m.hp)} HP · ${fmt(e.m.exp)} EXP`}</span></li>`).join("")
    : `<li class="empty" aria-disabled="true">Nic nie pasuje do „${esc(q)}”</li>`;
  ul.hidden = false;
  $("#combo").setAttribute("aria-expanded", "true");
  $("#q").setAttribute("aria-activedescendant", sel >= 0 ? "opt0" : "");
}
function close() { $("#sugg").hidden = true; $("#combo").setAttribute("aria-expanded", "false"); sel = -1; }
function mark() {
  [...$("#sugg").children].forEach((li, i) => li.setAttribute("aria-selected", i === sel));
  const li = document.getElementById("opt" + sel);
  if (li) { li.scrollIntoView({ block: "nearest" }); $("#q").setAttribute("aria-activedescendant", li.id); }
}
function pick(e) { if (!e) return; $("#q").value = e.name; close(); open(e.kind, e.name); $("#q").blur(); }

$("#q").addEventListener("input", suggest);
$("#q").addEventListener("focus", () => { if ($("#q").value.trim()) suggest(); });
$("#q").addEventListener("keydown", ev => {
  const vis = !$("#sugg").hidden;
  if (ev.key === "ArrowDown") { ev.preventDefault(); if (!vis) suggest(); else if (shown.length) { sel = (sel + 1) % shown.length; mark(); } }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); if (vis && shown.length) { sel = (sel - 1 + shown.length) % shown.length; mark(); } }
  else if (ev.key === "Enter") { ev.preventDefault(); if (vis && sel >= 0) pick(shown[sel]); }
  else if (ev.key === "Escape") close();
});
$("#sugg").addEventListener("mousedown", ev => {
  const li = ev.target.closest("li[data-i]");
  if (li) { ev.preventDefault(); pick(shown[+li.dataset.i]); }
});
document.addEventListener("click", ev => { if (!ev.target.closest(".search")) close(); });

function readHist() { const h = readJSON("ll-hist", []); return Array.isArray(h) ? h.filter(exists).slice(0, 8) : []; }
function pushHist(kind, name) {
  const h = [{ kind, name }, ...readHist().filter(x => !(x.kind === kind && x.name === name))].slice(0, 8);
  ls.set("ll-hist", JSON.stringify(h));
  renderHist(h);
}
function renderHist(h = readHist()) {
  $("#hist").innerHTML = h.length ? `<span class="eyebrow">Ostatnio</span>` +
    h.map(x => `<button class="chip" data-k="${x.kind}" data-n="${esc(x.name)}">${esc(x.name)}</button>`).join("") : "";
}
$("#hist").addEventListener("click", ev => { const b = ev.target.closest(".chip"); if (b) open(b.dataset.k, b.dataset.n); });

function open(kind, name) {
  if (!exists({ kind, name })) return;
  state.view = { kind, name };
  pushHist(kind, name);
  ls.set("ll-last", JSON.stringify(state.view));
  render();
}
function hitClass(h) { const lim = +state.maxHit; if (!lim) return ""; return h > lim ? "hit-bad" : h > lim * 0.8 ? "hit-warn" : "hit-ok"; }
function render() {
  const v = state.view, el = $("#view");
  if (!v) { el.innerHTML = ""; return; }
  if (v.kind === "item") renderItem(el, items.get(v.name.toLowerCase()));
  else renderMonster(el, byName.get(v.name.toLowerCase()));
}

const COLS = [["monster", "Potwór", 0], ["rar", "Rzadkość", 0], ["c", "Max", 1], ["hp", "HP", 1], ["exp", "EXP", 1], ["eph", "EXP/HP", 1], ["hit", "Max hit", 1]];
const SORT_KEYS = {
  monster: d => d.m.name.toLowerCase(), rar: d => d.r, c: d => d.c, hp: d => d.m.hp, exp: d => d.m.exp,
  eph: d => d.m.hp ? d.m.exp / d.m.hp : 0, hit: d => d.m.hit
};
const eph = m => m.hp ? (m.exp / m.hp).toFixed(2) : "–";

function filters() {
  return `<div class="filters">
    <label for="fb"><input id="fb" type="checkbox" ${state.boss ? "checked" : ""}> Pokaż bossy</label>
    <label for="fh">Max hit do <input id="fh" type="number" min="0" max="9999999" step="50" inputmode="numeric" placeholder="bez limitu" value="${esc(state.maxHit)}"></label>
  </div>`;
}
function renderItem(el, it) {
  if (!it) { el.innerHTML = `<section class="panel"><p class="empty-state">Nie ma takiego przedmiotu w danych.</p></section>`; return; }
  const lim = +state.maxHit, key = SORT_KEYS[state.sort];
  const rows = it.drops.filter(d => (state.boss || !d.m.boss) && (!lim || d.m.hit <= lim));
  rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * state.dir || SORT_KEYS.eph(b) - SORT_KEYS.eph(a); });
  const hidden = it.drops.length - rows.length;
  el.innerHTML = `<section class="panel">
    <div class="ph"><div class="ph-title">${itemImg(it.name, "ico-lg")}<div><div class="eyebrow">Przedmiot</div><h2>${esc(it.name)}</h2></div></div>
      <div class="sub">Wypada z ${it.drops.length} ${it.drops.length === 1 ? "potwora" : "potworów"}</div></div>
    ${filters()}
    ${rows.length ? `<div class="tbl"><table><thead><tr>${COLS.map(([k, l, n]) => `<th class="sort${n ? " n" : ""}" data-k="${k}" aria-sort="${state.sort === k ? (state.dir > 0 ? "ascending" : "descending") : "none"}">${l}${state.sort === k ? ` <span class="arr">${state.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(d => `<tr><td>${monImg(d.m.name)}<button class="link" data-m="${esc(d.m.name)}">${esc(d.m.name)}</button>${d.m.boss ? `<span class="boss">BOSS</span>` : ""}</td>
        <td><span class="rar r${d.r}">${RAR[d.r]}</span> <span class="chance">${CH[d.r]}</span></td>
        <td class="n">${fmt(d.c)}</td><td class="n">${fmt(d.m.hp)}</td><td class="n">${fmt(d.m.exp)}</td>
        <td class="n">${eph(d.m)}</td><td class="n ${hitClass(d.m.hit)}">${fmt(d.m.hit)}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="empty-state">Żaden potwór nie spełnia filtrów.</p>`}
    ${hidden ? `<p class="note">Ukryto ${hidden} przez filtry.</p>` : ""}
  </section>`;
}
function renderMonster(el, m) {
  if (!m) { el.innerHTML = `<section class="panel"><p class="empty-state">Nie ma takiego potwora w danych.</p></section>`; return; }
  const worst = m.spells.reduce((a, s) => a + s.max, 0);
  const sp = [...m.spells].sort((a, b) => b.max - a.max);
  const top = Math.max(1, ...sp.map(s => s.max));
  const groups = [0, 1, 2, 3, 4].map(r => ({ r, g: m.loot.filter(l => l.r === r) })).filter(x => x.g.length);
  el.innerHTML = `<section class="panel">
    <div class="ph"><div class="ph-title">${monImg(m.name, "ico-xl")}<div><div class="eyebrow">Potwór${m.boss ? ` · <span class="boss boss-inline">BOSS</span>` : ""}</div><h2>${esc(m.name)}</h2></div></div>
      <a class="sub" href="https://www.landoriaots.pl/monsters.php?name=${encodeURIComponent(m.name)}" target="_blank" rel="noopener noreferrer">Strona potwora ↗</a></div>
    <div class="stats">
      <div class="stat"><b>${fmt(m.hp)}</b><span>HP</span></div>
      <div class="stat"><b>${fmt(m.exp)}</b><span>EXP bazowy</span></div>
      <div class="stat"><b>${eph(m)}</b><span>EXP / HP</span></div>
      <div class="stat"><b class="${hitClass(m.hit)}">${fmt(m.hit)}</b><span>Max hit</span></div>
      <div class="stat"><b>${fmt(m.aoe)}</b><span>Max AoE</span></div>
      <div class="stat"><b>${fmt(worst)}</b><span>Suma maksów</span></div>
    </div>
    <div class="grid2">
      <div><h3>Ataki</h3>
        ${sp.length ? `<div class="tbl"><table><thead><tr><th>Typ</th><th>Zasięg</th><th class="n">Min</th><th class="n">Max</th></tr></thead><tbody>
        ${sp.map(s => `<tr><td>${esc(s.type)}</td><td>${esc(s.atk)}</td><td class="n">${fmt(s.min)}</td><td class="n"><span class="bar" data-w="${Math.round(s.max / top * 48)}"></span>${fmt(s.max)}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="empty-state">Brak danych o atakach.</p>`}
      </div>
      <div><h3>Loot</h3>
        ${groups.length ? groups.map(({ r, g }) => `<div class="lootgrp"><div><span class="rar r${r}">${RAR[r]}</span> <span class="chance">${CH[r]}</span></div>
          <ul>${g.map(l => `<li><span class="li-name">${itemImg(l.name)}<button class="link" data-i="${esc(l.name)}">${esc(l.name)}</button></span><span class="cnt">${l.c > 1 ? "do " + fmt(l.c) : "1"}</span></li>`).join("")}</ul></div>`).join("")
          : `<p class="empty-state">Brak lootu.</p>`}
      </div>
    </div>
  </section>`;
  el.querySelectorAll(".bar[data-w]").forEach(b => { b.style.width = b.dataset.w + "px"; });
}

$("#view").addEventListener("click", ev => {
  const th = ev.target.closest("th.sort");
  if (th) {
    const k = th.dataset.k;
    if (!(k in SORT_KEYS)) return;
    if (state.sort === k) state.dir *= -1;
    else { state.sort = k; state.dir = ["monster", "rar", "hit"].includes(k) ? 1 : -1; }
    render();
    return;
  }
  const b = ev.target.closest("button.link");
  if (b) {
    if (b.dataset.m) open("monster", b.dataset.m);
    else if (b.dataset.i) open("item", b.dataset.i);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});
$("#view").addEventListener("change", ev => {
  if (ev.target.id === "fb") state.boss = ev.target.checked;
  else if (ev.target.id === "fh") state.maxHit = /^\d{1,7}$/.test(ev.target.value) ? ev.target.value : "";
  else return;
  ls.set("ll-filters", JSON.stringify({ boss: state.boss, maxHit: state.maxHit }));
  render();
});

const logo = safeSrc(String(LOOT_CONFIG.logo || "").trim());
if (logo) $("#logo-slot").innerHTML = img(logo, "logo");
const bg = safeSrc(String(LOOT_CONFIG.headerBackground || "").trim());
if (bg) { const h = $("header"); h.classList.add("has-bg"); h.style.backgroundImage = `url("${bg.replace(/["\\\n\r]/g, "")}")`; }

load(JSON.parse(document.getElementById("data").textContent));
renderHist();
const last = readJSON("ll-last", null);
state.view = exists(last) ? { kind: last.kind, name: last.name }
  : { kind: "item", name: items.has("crystalline armor") ? "crystalline armor" : [...items.values()][0].name };
render();
})();
</script>
</body>
</html>
